# Conexão usada pelo plugin Ontop do Protégé, que roda fora do Docker e por isso
# alcança o Postgres em localhost (a porta 5432 é publicada pelo docker-compose).
# O endpoint, que roda dentro da rede do compose, usa imdb.properties.
jdbc.url=jdbc:postgresql://localhost:5432/imdb
jdbc.user=imdb
jdbc.password=imdb
jdbc.driver=org.postgresql.Driver
