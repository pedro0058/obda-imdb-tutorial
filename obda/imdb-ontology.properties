# Connection used by the Ontop plugin for Protege, which runs outside Docker and
# therefore reaches Postgres on localhost (port 5432 is published by docker-compose).
# The endpoint, running inside the compose network, uses imdb.properties instead.
jdbc.url=jdbc:postgresql://localhost:5432/imdb
jdbc.user=imdb
jdbc.password=imdb
jdbc.driver=org.postgresql.Driver
